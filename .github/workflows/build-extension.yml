name: Build Extension

on:
  repository_dispatch:
    types: [build-trigger]

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yml
    permissions:
      id-token: write
      actions: read
      contents: write
      attestations: write
    with:
      discord_report: true
    secrets: inherit

  publish-nightly:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    concurrency:
      group: publish-nightly
      cancel-in-progress: true
    steps:
      # Give a freshly landed push a short window to be superseded by
      # another commit before it goes out to the store.
      - name: Delay Publish 5 Minutes
        run: sleep 300

      - name: Checkout Extension Repo
        uses: actions/checkout@v4

      - name: Uses Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Nightly Artifact
        uses: actions/download-artifact@v4
        with:
          name: nightly
          path: dist

      - name: Upload to Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: jgnjpfcdneiofkjkidlokfipfaignogj
        run: node scripts/cws-client.js upload --file dist/frankerfacez-nightly-*.zip

      - name: Publish on Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: jgnjpfcdneiofkjkidlokfipfaignogj
        run: node scripts/cws-client.js publish

      - name: Report Success
        if: success()
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          embed-color: 3066993
          embed-title: ✅ Chrome Nightly Upload Succeeded
          embed-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report Failure
        if: failure()
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          embed-color: 15158332
          embed-title: ❌ Chrome Nightly Upload Failed
          embed-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
